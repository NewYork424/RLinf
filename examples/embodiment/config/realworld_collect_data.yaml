defaults:
  - env/realworld_peg_insertion@env.eval
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env:
      node_group: franka
      placement: 0
  node_groups:
    - label: franka
      node_ranks: 0
      hardware:
        type: Franka
        configs:
          - robot_ip: 192.168.1.2
            node_rank: 0

runner:
  task_type: embodied
  logger:
    log_path: null
    project_name: rlinf
    experiment_name: "collect-data"
    logger_backends: ["tensorboard"] # wandb, swanlab
  num_data_episodes: 60
  record_task_description: False

env:
  group_name: "EnvGroup"
  eval:
    no_gripper: True
    ignore_terminations: False
    auto_reset: False
    use_spacemouse: True
    max_episode_steps: 200000000
    override_cfg:
      camera_serials: ["141722075170","233622072915", ]
      enable_camera_depth: True
      camera_observation_size: 256
      target_ee_pose: [ 0.58568951 , 0.0377056 , -0.00938398 , 3.00238222, -0.00808239 ,-0.09303466]
      success_hold_steps: 1  # define how many consecutive steps the robot must hold the position to succeed
      max_num_steps: 200000000
      random_xy_range: 0.01
      random_rz_range: 0.01  # About np.pi/9 * 1.5
      clip_x_range: 0.3
      clip_y_range: 0.3
      clip_z_range_low: 0.006
      clip_z_range_high: 0.15
      clip_rz_range: 0.5

  data_collection:
    enabled: True
    save_dir: ${runner.logger.log_path}/collected_data
    export_format: "lerobot"      # or "pickle"
    only_success: True
    robot_type: "panda"
    fps: 10
