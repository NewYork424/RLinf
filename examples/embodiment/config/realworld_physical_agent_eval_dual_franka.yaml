defaults:
  - env/realworld_dual_franka_tcp_rot6d@env.train
  - env/realworld_dual_franka_tcp_rot6d@env.eval
  - model/pi0_5@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 2
  component_placement:
    actor:
      node_group: franka
      placement: 0
    rollout:
      node_group: franka
      placement: 0
    env:
      node_group: franka
      placement: 0
  node_groups:
    - label: franka
      node_ranks: 0-1
      env_configs:
        - node_ranks: 0
          python_interpreter_path: null  # Only set when node 0 needs a different venv from the entry script.
      hardware:
        type: DualFranka
        configs:
          - left_robot_ip: "172.16.0.2"                   # Replace: left arm FCI IP
            right_robot_ip: "172.16.0.2"                  # Replace: right arm FCI IP
            base_camera_serials:
              - "141722070657"                          # Replace: librealsense device serial
            base_camera_type: realsense
            left_camera_serials:
              - "usb-XVisio_Technology_XVisio_vSLAM_250801DR48FB26001216-video-index0"                          # Replace: e.g. usb-XVisio_..._video-index0
            left_camera_type: lumos
            right_camera_serials:
              - "usb-XVisio_Technology_XVisio_vSLAM_250801DR48FB26001242-video-index0"                         # Replace: e.g. usb-XVisio_..._video-index0
            right_camera_type: lumos
            left_gripper_type: robotiq
            right_gripper_type: robotiq
            left_gripper_connection: "/dev/serial/by-id/usb-FTDI_USB_TO_RS-485_DAAIR00N-if00-port0"    # Replace: /dev/serial/by-id/...
            right_gripper_connection: "/dev/serial/by-id/usb-FTDI_USB_TO_RS-485_DAAIT8PU-if00-port0"  # Replace: /dev/serial/by-id/...
            left_controller_node_rank: 0
            right_controller_node_rank: 1
            node_rank: 0

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: dual-franka-openpi
    experiment_name: "realworld-eval-dual-franka"
    logger_backends: ["tensorboard"]
  max_epochs: 100
  max_steps: 100
  only_eval: True
  val_check_interval: -1

algorithm:
  update_epoch: 1
  group_size: 1
  eval_rollout_epoch: 100
  adv_type: gae
  loss_type: actor  # eval-only; any non-critic loss avoids the value-head assertion
  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
  length_params:
    max_new_token: 7
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"
  enable_offload: False
  eval:
    use_gello_joint: False
    use_gello: False
    use_spacemouse: False
    keyboard_reward_wrapper: null
    max_episode_steps: 10000
    max_steps_per_rollout_epoch: 10000
    override_cfg:
      
      # task_description: "Hold one side of the bag handle with the left hand to keep it open, then use the right hand to sequentially pick up the drink, potato chips ,and biscuits and place them into the bag."
      task_description: "I am currently performing a desk organizing task. I will use my right hand to hand  bowls, plates, cups, chopsticks, and a spoon to my left hand in order, and then put them into a basket." 
      # task_description: "I am completing a task of washing a cup. I need to pick up the cup with my left hand, pick up the brush with my right hand, use the brush to rotate and clean inside the cup, and then put the cup and the brush back in their original positions."
      # task_description: "Grab the cup with your left hand, grab the brush with your right hand, scrub the cup, then put the brush back onto the plate and invert the cup."
      # task_description: "The right arm pulls open the drawer, while the left arm places the two items into the drawer one after another.Quality:5."
       # Replace: prompt for the SFT policy
      #cv2 default false
      enable_camera_player: false
      # [ADDED] Gripper control mode:
      #   false (default) → binary open/close triggered by threshold (original behaviour)
      #   true            → continuous position tracking, gello opening maps to gripper width

      continuous_gripper: false


      # Replace: recompute from your SFT dataset's first-frame joint means;
      # stale values push initial obs out of the training distribution.
      joint_reset_qpos:
        # - [ 0.224, 0.041, -0.579, -1.744, -0.366, 2.586,  0.312]
        # - [-0.445, 0.125,  0.622, -1.565,  0.260, 1.988, -0.553]
        # umi-washing
        # - [0.5061,-0.0349,-0.6109,-1.8675,-0.2094,2.2515,0.5061]
        # - [0.7156,-0.1396,-0.7679,-2.0246,0.0873,2.3562,-0.4538]
        # umi-bagging
        # - [0.4363, -0.5411, -0.4712, -2.3736, -0.8203, 2.6529, 0.4712]
        # - [-0.0524, -0.4014, 0.0698, -2.6354, -0.1920, 3.1067, 0.3665]
        # umi-pull-drawer
        # - [0.1745, -0.3142, -0.1047, -2.0246, -0.4712, 2.0769, 0.6283]
        # - [0.1047, -0.5061, -0.0175, -2.3562, 0.4189, 2.6005, -0.0524]
        # # #dual-franka
        - [-0.22, 0.09, 0.35, -1.62, 0.21, 2.2, -0.56]
        - [-0.16, 0.23, -0.16, -1.48, -0.12, 2.41, 0.21]
      target_ee_pose:                         # Replace if your workspace differs
        - [0.5, -0.2, 0.5, -3.14, 0.0, 0.0]
        - [0.5,  0.2, 0.5, -3.14, 0.0, 0.0]
      success_hold_steps: 1

    #open rollout-collect—data
    data_collection:
      enabled: False
      save_dir: /home/raojiaji/data_raojiaji/rollout_data/deploy_612_umi_franka
      export_format: "lerobot"
      robot_type: "dual_FR3"
      fps: 10
      only_success: False
      resume: False


rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  recompute_logprobs: False
  enable_offload: False
  pipeline_stage_num: 1
  collect_transitions: False
  collect_prev_infos: False
  sync_weight_nccl_max_ctas: 32
  model:
    # SFT ckpt expected layout:abb
    #   <model_path>/actor/model_state_dict/full_weights.pt
    #   <model_path>/<openpi_data.repo_id>/norm_stats.jsonb
    model_path: /home/raojiaji/deploy/deploy_0727_jax_clean_desk  #/home/raojiaji/deploy/deploy_629_washing_mixed_franka_umi # deploy_616_umi_franka_washing_cropped   # Replace: /path/to/checkpoints/<run>/global_step_<N>/
    precision: ${actor.model.precision}

critic:
  use_critic_model: False

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  global_batch_size: 1
  seed: 1234
  enable_offload: False
  model:
    model_path: ${rollout.model.model_path}
    precision: null
    num_action_chunks: 20          # matches SFT action_horizon
    action_dim: 20                 # dual-franka tcp_rot6d: [L_xyz, L_rot6d, L_grip, R_xyz, R_rot6d, R_grip]
    add_value_head: False
    openpi:
      config_name: "pi05_dualfranka_tcp_rot6d"
      train_expert_only: False
      detach_critic_input: True
      action_chunk: ${actor.model.num_action_chunks}

    openpi_data:
      repo_id: id_0  # Replace: HF repo id used during SFT
