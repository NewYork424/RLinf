defaults:
  - model/pi0@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 0

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "realworld-grasp-primitive-sft-smoke"
    logger_backends: ["tensorboard"]

  max_epochs: -1
  max_steps: 1
  val_check_interval: -1
  save_interval: -1

data:
  # Two successful smoke episodes collected on 2026-07-09.
  # Replace with the larger merged LeRobot dataset for real training.
  train_data_paths: ${oc.env:GRASP_SFT_DATA_REPO_ID,realworld_franka_grasp_primitive}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  global_batch_size: 1
  seed: 0

  model:
    precision: null
    model_path: ${oc.env:PI0_MODEL_PATH,/path/to/pi0-model}
    num_action_chunks: 10
    action_dim: 7
    is_lora: true
    lora_rank: 16
    add_value_head: false
    openpi:
      config_name: "pi0_realworld"
      detach_critic_input: true
      num_images_in_input: 2

  optim:
    lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    warmup_style: "cosine"
    lr_warmup_steps: 0
    total_training_steps: 1

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    use_orig_params: true
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
